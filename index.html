<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- script-src allows esm.sh (Shiki and its grammar/theme modules, all loaded via
       import()). Shiki runs its JavaScript regex engine, so no WASM: no
       'wasm-unsafe-eval' and no esm.sh in connect-src. style/font-src stay https-wide
       (no host allowlist) so any https font CDN works; 'unsafe-inline' is required
       because Shiki emits inline style attributes. Update when adding new CDNs. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMuse — coding font × theme × language</title>
  <meta name="description" content="Preview a coding font, color theme, and programming language together, live in the browser. Mix and match, share a link, and export the setup to VS Code.">
  <!-- Social cards. og:image is intentionally omitted until a preview image
       exists — add it (plus twitter:image, summary_large_image) when ready. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zhoufanscut.github.io/VMuse/">
  <meta property="og:site_name" content="VMuse">
  <meta property="og:title" content="VMuse — coding font × theme × language">
  <meta property="og:description" content="Preview a coding font, color theme, and language together, live. Mix, match, share a link, export to VS Code.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="VMuse — coding font × theme × language">
  <meta name="twitter:description" content="Preview a coding font, color theme, and language together, live. Mix, match, share a link, export to VS Code.">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./src/style.css">
  <style>
    /* Boot overlay: paints before any external resource arrives */
    #boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
      color: #ccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.125rem;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    #boot-overlay.is-error { color: #ff8080; }
  </style>
</head>
<body>
  <div id="boot-overlay" role="status">Loading highlighter…<noscript> VMuse needs JavaScript to run.</noscript></div>

  <!-- DOM order is reading/Tab order: header, tabs, controls, preview, then the
       two sidebars. The grid areas in style.css place them visually. -->
  <header><h1>VMuse</h1><span class="header-quote">Style is the perfection of a point of view. — Richard Eberhart</span></header>
  <nav class="lang-tabs" role="tablist" aria-label="Language"></nav>
  <div class="controls-bar" role="group" aria-label="Preview controls"></div>
  <main id="preview" class="preview-pane" aria-label="Code preview"></main>
  <aside class="sidebar-fonts" aria-label="Fonts"></aside>
  <aside class="sidebar-themes" aria-label="Themes"></aside>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
